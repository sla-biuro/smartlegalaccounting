name: Deploy Nuxt (Alternative)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: nuxt
          
      - name: Install dependencies
        run: npm ci
        
      - name: Force Tailwind rebuild
        run: |
          npx tailwindcss -i ./assets/css/tailwind.css -o ./assets/css/tailwind-built.css --watch=false
          ls -la assets/css/
          echo "Built Tailwind CSS size:"
          wc -c assets/css/tailwind-built.css || echo "Build failed"
        
      - name: Update Nuxt config for built CSS
        run: |
          cp nuxt.config.ts nuxt.config.backup.ts
          sed -i "s|assets/css/tailwind.css|assets/css/tailwind-built.css|g" nuxt.config.ts || true
          
      - name: Generate with pre-built Tailwind
        run: npm run generate
        env:
          NODE_ENV: production
          NUXT_APP_BASE_URL: /logistics-site/
          NUXT_APP_CDN_URL: /logistics-site/
          NITRO_PRESET: github_pages
          
      - name: Fix asset paths
        run: |
          find .output/public -name "*.html" -type f -exec sed -i 's|href="/_nuxt/|href="/logistics-site/_nuxt/|g' {} +
          find .output/public -name "*.html" -type f -exec sed -i 's|src="/_nuxt/|src="/logistics-site/_nuxt/|g' {} +
          
      - name: Verify build
        run: |
          echo "Generated CSS files and sizes:"
          find .output/public -name "*.css" -exec ls -lh {} +
          echo ""
          echo "Sample HTML content:"
          head -n 50 .output/public/index.html
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
