# Workflow for building and deploying a Nuxt 4 site with Tailwind CSS to GitHub Pages
name: Deploy Nuxt site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "runner=pnpm" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          
      - name: Setup pnpm
        if: steps.detect-package-manager.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: nuxt
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            .output
            node_modules/.cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-
            
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        
      - name: Build Nuxt application
        run: |
          echo "Building with base URL: /logistics-site/"
          echo "Repository name: ${{ github.event.repository.name }}"
          echo "GitHub event repository name: ${{ github.event.repository.name }}"
          ${{ steps.detect-package-manager.outputs.manager }} run generate
        env:
          # Ensure Tailwind CSS processes all styles and use production base URL
          NODE_ENV: production
          # Set the base URL explicitly for GitHub Pages project repository
          NUXT_APP_BASE_URL: /logistics-site/
          
      - name: List generated files (debug)
        run: |
          echo "Generated files:"
          ls -la .output/public/
          echo ""
          echo "Index.html content (first 1000 chars):"
          head -c 1000 .output/public/index.html
          echo ""
          echo "CSS files:"
          ls -la .output/public/_nuxt/*.css || echo "No CSS files found"
          echo ""
          echo "Checking if CSS contains base URL:"
          grep -r "logistics-site" .output/public/ || echo "No logistics-site references found"
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
