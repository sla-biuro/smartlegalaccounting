name: Deploy Nuxt to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "runner=pnpm" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          
      - name: Setup pnpm
        if: steps.detect-package-manager.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: nuxt
          
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            .output
            node_modules/.cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('package-lock.json', 'yarn.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-
            
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        
      - name: Verify Tailwind installation
        run: |
          echo "=== TAILWIND VERIFICATION ==="
          echo "Checking if Tailwind is properly installed:"
          npm list @nuxtjs/tailwindcss
          npm list tailwindcss
          echo "Verifying Tailwind CSS file exists:"
          ls -la assets/css/
          cat assets/css/tailwind.css
        
      - name: Debug Tailwind setup
        run: |
          echo "=== TAILWIND DEBUG ==="
          echo "Current working directory:"
          pwd
          echo "Tailwind config:"
          cat tailwind.config.js
          echo "Nuxt config:"
          cat nuxt.config.ts
          echo "CSS file content:"
          cat assets/css/tailwind.css
          echo "Package.json (tailwind related):"
          grep -A 5 -B 5 tailwindcss package.json || echo "No tailwindcss found"
          echo "Node modules tailwind:"
          ls node_modules | grep tailwind || echo "No tailwind modules found"
          
      - name: Generate static site
        run: npm run generate
        env:
          NODE_ENV: production
          
      - name: Verify build
        run: |
          echo "=== BUILD VERIFICATION ==="
          echo "Generated CSS files and sizes:"
          find .output/public -name "*.css" -exec ls -lh {} +
          echo ""
          echo "CSS file contents (first 100 lines):"
          find .output/public -name "*.css" -exec head -n 100 {} +
          echo ""
          echo "Sample HTML content:"
          head -n 50 .output/public/index.html
          echo ""
          echo "Checking for Tailwind classes in HTML:"
          grep -o "class=\"[^\"]*\"" .output/public/index.html | head -10
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
