<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="peopleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Team of people -->
  <g transform="translate(80, 60)">
    <!-- Person 1 -->
    <circle cx="40" cy="40" r="25" fill="url(#peopleGrad)" stroke="#1e40af" stroke-width="2"/>
    <rect x="20" y="65" width="40" height="60" rx="20" fill="url(#peopleGrad)" stroke="#1e40af" stroke-width="2"/>
    <!-- Face -->
    <circle cx="35" cy="35" r="3" fill="#ffffff"/>
    <circle cx="45" cy="35" r="3" fill="#ffffff"/>
    <path d="M32 45 Q40 50 48 45" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Person 2 (center, larger) -->
    <circle cx="120" cy="35" r="28" fill="url(#peopleGrad)" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="95" y="63" width="50" height="70" rx="25" fill="url(#peopleGrad)" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Face -->
    <circle cx="113" cy="30" r="3" fill="#ffffff"/>
    <circle cx="127" cy="30" r="3" fill="#ffffff"/>
    <path d="M110 42 Q120 47 130 42" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Person 3 -->
    <circle cx="200" cy="40" r="25" fill="url(#peopleGrad)" stroke="#16a34a" stroke-width="2"/>
    <rect x="180" y="65" width="40" height="60" rx="20" fill="url(#peopleGrad)" stroke="#16a34a" stroke-width="2"/>
    <!-- Face -->
    <circle cx="195" cy="35" r="3" fill="#ffffff"/>
    <circle cx="205" cy="35" r="3" fill="#ffffff"/>
    <path d="M192 45 Q200 50 208 45" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Connection lines -->
  <g opacity="0.6">
    <line x1="120" y1="180" x2="160" y2="180" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="180" x2="240" y2="180" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="200" cy="180" r="6" fill="#facc15" stroke="#f59e0b" stroke-width="2"/>
  </g>
  
  <!-- HR symbols -->
  <g transform="translate(300, 50)" opacity="0.8">
    <rect x="0" y="0" width="30" height="20" rx="3" fill="#facc15" stroke="#f59e0b" stroke-width="1"/>
    <rect x="0" y="25" width="25" height="15" rx="3" fill="#2563eb"/>
    <circle cx="45" cy="15" r="10" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
    <text x="15" y="12" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="bold">HR</text>
  </g>
</svg>