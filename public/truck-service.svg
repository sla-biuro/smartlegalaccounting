<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#facc15"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Modern truck illustration -->
  <g transform="translate(50, 80)">
    <!-- Truck body -->
    <rect x="0" y="40" width="200" height="80" rx="8" fill="url(#truckGrad)" stroke="#1e40af" stroke-width="2"/>
    <rect x="160" y="20" width="80" height="60" rx="8" fill="url(#truckGrad)" opacity="0.9" stroke="#1e40af" stroke-width="2"/>
    
    <!-- Windows -->
    <rect x="165" y="25" width="30" height="25" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <rect x="200" y="25" width="35" height="25" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    
    <!-- Wheels -->
    <circle cx="40" cy="140" r="20" fill="#374151" stroke="#111827" stroke-width="2"/>
    <circle cx="40" cy="140" r="12" fill="#6b7280"/>
    <circle cx="40" cy="140" r="6" fill="#9ca3af"/>
    <circle cx="200" cy="140" r="20" fill="#374151" stroke="#111827" stroke-width="2"/>
    <circle cx="200" cy="140" r="12" fill="#6b7280"/>
    <circle cx="200" cy="140" r="6" fill="#9ca3af"/>
    
    <!-- Details -->
    <rect x="10" y="60" width="12" height="6" fill="#facc15" rx="1"/>
    <rect x="10" y="70" width="12" height="6" fill="#facc15" rx="1"/>
    <rect x="10" y="80" width="12" height="6" fill="#facc15" rx="1"/>
    
    <!-- Company logo placeholder -->
    <circle cx="100" cy="80" r="15" fill="#ffffff" opacity="0.8"/>
    <text x="100" y="85" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="bold">L</text>
  </g>
  
  <!-- Motion lines -->
  <g opacity="0.6">
    <line x1="320" y1="100" x2="360" y2="100" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <line x1="320" y1="110" x2="355" y2="110" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <line x1="320" y1="120" x2="350" y2="120" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>