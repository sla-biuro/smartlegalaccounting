<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Page Not Found</title>
    <script>
        // GitHub Pages SPA redirect (only redirect if not already at root)
        if (location.pathname !== '/' && location.pathname !== '/404.html') {
            sessionStorage.redirect = location.href;
            window.location.replace('/');
        }
    </script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div style="text-align: center; color: white;">
        <h1 style="font-size: 3rem; margin: 0;">404</h1>
        <p style="font-size: 1.2rem;">Page not found. Redirecting...</p>
    </div>
</body>
</html>
